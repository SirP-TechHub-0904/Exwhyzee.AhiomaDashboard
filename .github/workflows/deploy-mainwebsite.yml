name: Deploy MainWebsite to Hostinger

on:
  push:
    branches:
      - master
    paths:
      - 'Exwhyzee.AhiomaDashboard.MainWebsite/**'
      - 'Exwhyzee.AhiomaDashboard.Core/**'
      - 'Exwhyzee.AhiomaDashboard.Data/**'
      - 'Exwhyzee.AhiomaDashboard.EntityFramework/**'
      - '.github/workflows/deploy-mainwebsite.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy MainWebsite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore Exwhyzee.AhiomaDashboard.MainWebsite/Exwhyzee.AhiomaDashboard.MainWebsite.csproj

      - name: Publish Application
        run: |
          dotnet publish Exwhyzee.AhiomaDashboard.MainWebsite/Exwhyzee.AhiomaDashboard.MainWebsite.csproj \
            -c Release \
            -o ./publish

      - name: Configure SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Prepare Remote Directory & Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.HOSTINGER_SSH_PORT }} -H ${{ secrets.HOSTINGER_SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null
          ssh -p ${{ secrets.HOSTINGER_SSH_PORT }} ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SERVER_IP }} "mkdir -p /var/www/ahioma-main"

      - name: Deploy to Hostinger VPS (Preserving .env)
        run: |
          rsync -avz --delete \
            --exclude='.env*' \
            -e "ssh -p ${{ secrets.HOSTINGER_SSH_PORT }}" \
            ./publish/ \
            ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SERVER_IP }}:/var/www/ahioma-main/

      - name: Restart Systemd Service
        run: |
          ssh -p ${{ secrets.HOSTINGER_SSH_PORT }} ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SERVER_IP }} "
            sudo chown -R www-data:www-data /var/www/ahioma-main
            if systemctl is-active --quiet ahioma-main; then
              sudo systemctl restart ahioma-main
              echo 'ahioma-main service restarted successfully.'
            else
              echo 'Note: ahioma-main systemd service is not active yet. Please configure and enable it.'
            fi
          "
